<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Semáforo de la Igualdad · CREI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    /* Colores CREI */
    --morado:#5B509D; --naranja:#F08215; --turquesa:#21B2BE; --azul:#1F71B7; --gris:#929393;
    --tinta:#2B2A3D; --suave:#6D6C7E; --fondo:#FFFFFF; --crema:#F6F5FB; --borde:#E8E6F2;
    /* Luces del semáforo */
    --rojo:#E5483D; --ambar:#F5B323; --verde:#3DB26B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--fondo);color:var(--tinta);font-family:Montserrat,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
  button{font:inherit;cursor:pointer;border:0}
  .pantalla{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
  .pantalla.activa{display:flex;animation:entra .4s ease-out}
  @keyframes entra{from{opacity:0}to{opacity:1}}

  /* Anillos decorativos como los del logo */
  .anillo{position:absolute;border-radius:50%;border-style:solid;opacity:.14;pointer-events:none}
  .a1{width:340px;height:340px;border-width:56px;border-color:var(--morado);top:-120px;left:-110px}
  .a2{width:260px;height:260px;border-width:44px;border-color:var(--naranja);bottom:-90px;right:8%}
  .a3{width:200px;height:200px;border-width:36px;border-color:var(--turquesa);top:12%;right:-60px}
  .a4{width:150px;height:150px;border-width:28px;border-color:var(--azul);bottom:16%;left:4%}

  /* ---------- Portada ---------- */
  .portada{align-items:center;justify-content:center;text-align:center;padding:36px;gap:22px;background:var(--fondo)}
  .portada .logo{width:min(300px,40vw);height:auto;position:relative}
  .portada h1{margin:6px 0 0;font-size:clamp(34px,5.4vw,60px);font-weight:800;line-height:1.05;letter-spacing:-.02em;color:var(--morado);position:relative}
  .portada h1 span{color:var(--naranja)}
  .portada p{margin:0;font-size:clamp(17px,2.1vw,21px);color:var(--suave);max-width:620px;line-height:1.5;font-weight:500;position:relative}
  .leyenda{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative}
  .leyenda span{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;color:var(--tinta);padding:10px 18px;border-radius:999px;background:var(--crema)}
  .leyenda b{width:18px;height:18px;border-radius:50%}
  .btn-grande{position:relative;background:var(--naranja);color:#fff;font-size:24px;font-weight:700;padding:20px 66px;border-radius:999px;
    box-shadow:0 10px 0 #C2650B;transition:transform .08s, box-shadow .08s;margin-top:6px}
  .btn-grande:active{transform:translateY(6px);box-shadow:0 4px 0 #C2650B}

  /* ---------- Juego ---------- */
  .juego{background:var(--crema)}
  .barra{display:flex;align-items:center;justify-content:space-between;padding:12px 26px;background:#fff;gap:16px;border-bottom:4px solid transparent;
    border-image:linear-gradient(90deg,var(--morado) 0 25%,var(--naranja) 25% 50%,var(--turquesa) 50% 75%,var(--azul) 75%) 1}
  .barra .mini{height:46px;width:auto}
  .progreso{display:flex;gap:8px}
  .progreso i{width:16px;height:16px;border-radius:50%;background:var(--borde)}
  .progreso i.ok{background:var(--verde)} .progreso i.mal{background:var(--rojo)} .progreso i.nose{background:var(--ambar)}
  .progreso i.ahora{background:#fff;box-shadow:inset 0 0 0 4px var(--morado)}
  .puntos{font-size:16px;font-weight:600;color:var(--suave)}
  .puntos b{font-size:24px;font-weight:800;color:var(--morado)}
  .salir{background:none;color:var(--suave);font-size:15px;font-weight:600;padding:8px 4px}

  .zona{flex:1;display:flex;align-items:center;justify-content:center;gap:40px;padding:26px 36px;min-height:0}
  .tarjeta{flex:1;max-width:760px;background:#fff;border-radius:28px;padding:44px 48px;box-shadow:0 18px 40px -24px rgba(91,80,157,.45);
    display:flex;flex-direction:column;gap:20px;min-height:320px;justify-content:center;position:relative;overflow:hidden}
  .tarjeta::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--acento,var(--morado))}
  .tarjeta .num{font-size:15px;font-weight:700;color:var(--acento,var(--morado))}
  .tarjeta .texto{font-size:clamp(25px,3.1vw,36px);line-height:1.32;font-weight:600;letter-spacing:-.01em;color:var(--tinta)}
  .tarjeta .pregunta{font-size:18px;color:var(--suave);font-weight:500}

  .semaforo{background:var(--morado);border-radius:48px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 22px 40px -18px rgba(91,80,157,.7)}
  .luz{width:150px;height:150px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    color:#fff;font-weight:800;font-size:22px;text-align:center;line-height:1.1;transition:transform .12s, filter .2s, box-shadow .2s;box-shadow:inset 0 -8px 0 rgba(0,0,0,.14)}
  .luz small{font-size:14px;font-weight:600;opacity:.95;max-width:120px;margin-top:2px}
  .luz.rojo{background:var(--rojo)}
  .luz.ambar{background:var(--ambar);color:#4A3300}
  .luz.verde{background:var(--verde)}
  .luz:active{transform:scale(.94)}
  .semaforo.respondido .luz{filter:grayscale(.8) brightness(.75);opacity:.55}
  .semaforo.respondido .luz.correcta,.semaforo.respondido .luz.elegida{filter:none;opacity:1}
  .luz.correcta{box-shadow:0 0 0 6px #fff,0 0 40px 8px rgba(255,255,255,.6)}

  /* ---------- Resultado de cada caso ---------- */
  .velo{position:fixed;inset:0;background:rgba(43,42,61,.45);display:none;align-items:flex-end;justify-content:center;padding:0 24px 26px;z-index:5}
  .velo.ver{display:flex;animation:entra .25s ease-out}
  .hoja{width:100%;max-width:980px;background:#fff;border-radius:28px;padding:28px 34px;display:flex;gap:24px;align-items:center;animation:sube .35s cubic-bezier(.2,.9,.3,1.2);
    border-top:8px solid var(--acento,var(--morado))}
  @keyframes sube{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
  .icono{width:84px;height:84px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:46px;font-weight:800}
  .hoja .cont{flex:1;display:flex;flex-direction:column;gap:6px}
  .hoja h2{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em;color:var(--tinta)}
  .hoja .color{font-size:15px;font-weight:700}
  .hoja .resp{font-size:21px;line-height:1.45;font-weight:500;color:var(--tinta)}
  .hoja .resp b{font-weight:800}
  .btn-sig{background:var(--morado);color:#fff;font-size:20px;font-weight:700;padding:20px 34px;border-radius:999px;flex-shrink:0;box-shadow:0 6px 0 #3F367A}
  .btn-sig:active{transform:translateY(4px);box-shadow:0 2px 0 #3F367A}

  /* ---------- Final ---------- */
  .final{align-items:center;justify-content:center;text-align:center;padding:36px;gap:18px;background:var(--fondo)}
  .final .logo{width:min(170px,26vw);height:auto;position:relative}
  .final .marcador{font-size:clamp(84px,14vw,140px);font-weight:800;line-height:1;letter-spacing:-.04em;color:var(--morado);position:relative}
  .final .marcador span{font-size:.38em;color:var(--gris)}
  .final .lbl{font-size:18px;font-weight:600;color:var(--suave);margin-top:-6px;position:relative}
  .final h2{margin:4px 0 0;font-size:clamp(28px,4vw,40px);font-weight:800;color:var(--naranja);position:relative}
  .final p{margin:0;font-size:20px;color:var(--suave);max-width:620px;line-height:1.5;font-weight:500;position:relative}
  .cuenta{font-size:14px;color:var(--gris);font-weight:600;position:relative}

  .pc{position:fixed;top:14px;right:16px;background:var(--crema);color:var(--suave);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:600;z-index:3}

  /* Tablet vertical */
  @media (max-aspect-ratio:1/1){
    .zona{flex-direction:column;gap:26px;justify-content:center}
    .tarjeta{flex:0 0 auto;width:100%;max-width:none;min-height:36vh;padding:44px 40px}
    .tarjeta .texto{font-size:clamp(26px,4.4vw,40px)}
    .semaforo{flex-direction:row;border-radius:999px;padding:16px 20px}
    .luz{width:min(180px,26vw);height:min(180px,26vw)}
    .hoja{flex-wrap:wrap}
    .btn-sig{width:100%}
  }
  @media (max-height:640px) and (min-aspect-ratio:1/1){
    .luz{width:116px;height:116px;font-size:18px} .luz small{font-size:12px}
    .tarjeta{padding:30px 34px;min-height:0}
  }
  @media (max-width:600px){ .progreso{display:none} .barra{padding:10px 16px} .hoja{padding:22px} .a1,.a2,.a3,.a4{display:none} }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ============ Casos ============
   [respuesta, situación, explicación]   v = verde (hay igualdad) · r = rojo (no hay igualdad)  */
var CASOS = [
  ["v", "Todos en la guardia reciben el mismo EPP nuevo.", "Hay igualdad porque todos merecemos la misma protección para volver sanos a casa."],
  ["v", "Todos los postulantes al puesto rinden la misma evaluación.", "Hay igualdad porque cada postulante tiene la misma oportunidad de demostrar lo que sabe."],
  ["v", "En el comedor, jefes y operarios hacen la misma cola.", "Hay igualdad porque no hay preferencias por ninguna persona, tenga el cargo que tenga."],
  ["v", "El trabajador nuevo recibe la misma inducción que sus compañeros.", "Hay igualdad porque así el nuevo compañero empieza bien preparado, igual que todos."],
  ["v", "En la reunión, el jefe escucha la opinión de todos.", "Hay igualdad porque cada opinión suma y todos se sienten parte del equipo."],
  ["v", "Un compañero mayor y uno joven reciben la misma capacitación.", "Hay igualdad porque a cualquier edad se puede seguir aprendiendo y creciendo."],
  ["v", "El jefe felicita al operario y al ingeniero que propusieron mejoras.", "Hay igualdad porque toda buena idea merece reconocimiento, venga de quien venga."],
  ["v", "Un compañero se burla de otro y el supervisor le pide respeto.", "Hay igualdad porque el supervisor cuida que todos nos sintamos respetados."],
  ["v", "Todos los cuartos del campamento se limpian con la misma frecuencia.", "Hay igualdad porque todos merecemos descansar en buenas condiciones después de la jornada."],
  ["v", "Al terminar el trabajo, el supervisor agradece a todo el equipo.", "Hay igualdad porque el trabajo sale adelante gracias al esfuerzo de todos."],
  ["v", "El sorteo de fin de año incluye a todo el personal.", "Hay igualdad porque todos tienen la misma oportunidad de ganar."],
  ["v", "Las reglas del campamento se explican igual a todos los que llegan.", "Hay igualdad porque todos conocemos las mismas reglas y sabemos qué esperar."],
  ["v", "Un compañero de otra área pide ayuda y el equipo lo ayuda.", "Hay igualdad porque somos un solo equipo y nos apoyamos sin mirar el área."],
  ["r", "Una vacante se cubre con un conocido del jefe, sin publicarla.", "No hay igualdad porque otros compañeros también merecían la oportunidad de postular."],
  ["r", "Dos compañeros llegan tarde: a uno le llaman la atención y al otro no le dicen nada.", "No hay igualdad porque una misma regla debería aplicarse de la misma manera a los dos."],
  ["r", "En las reuniones solo escuchan a los ingenieros y no a los operarios.", "No hay igualdad porque los operarios también conocen bien el trabajo y sus ideas pueden ayudar mucho."],
  ["r", "A los contratistas no los dejan entrar al comedor principal.", "No hay igualdad porque ellos también son parte de la operación y merecen las mismas comodidades."],
  ["r", "En el grupo de WhatsApp se burlan del aspecto de un compañero.", "No hay igualdad porque a nadie le gusta que se burlen de cómo es; todos merecemos respeto."],
  ["r", "El supervisor les grita a unos y con otros es amable.", "No hay igualdad porque todos merecemos que nos hablen con el mismo respeto y la misma calma."],
  ["r", "Dos guardias cumplen la meta y solo una recibe el premio.", "No hay igualdad porque las dos guardias se esforzaron igual y merecían el mismo reconocimiento."],
  ["r", "A un practicante lo hacen quedarse más tarde que a todos.", "No hay igualdad porque el practicante también necesita su descanso, como todos."],
  ["r", "No invitan a una persona a la reunión del área porque es nueva.", "No hay igualdad porque quien recién llega también es parte del área, y la reunión es una buena oportunidad para integrarlo."],
  ["r", "El jefe solo saluda a los de su oficina y no a los de planta.", "No hay igualdad porque un saludo es un gesto sencillo que todos merecemos por igual."],
  ["r", "Al operario le niegan un permiso que al ingeniero sí le dieron por el mismo motivo.", "No hay igualdad porque, si el motivo es el mismo, lo justo es que la respuesta también lo sea."],
  ["r", "No dejan participar a alguien en el campeonato porque «ya está mayor».", "No hay igualdad porque la edad no debería impedir que alguien participe y disfrute con el equipo."],
  ["r", "Eligen a alguien para un puesto sin evaluar a los demás postulantes.", "No hay igualdad porque los demás postulantes también merecían ser tomados en cuenta."],
  ["r", "Dejan fuera del grupo de trabajo a un compañero por ser de otra región.", "No hay igualdad porque venir de otro lugar no hace a nadie menos compañero; al contrario, suma al equipo."],
  ["r", "Descartan a una postulante para operadora solo por ser mujer.", "No hay igualdad porque lo importante es que la persona esté preparada para el puesto, sea hombre o mujer."]
];

var POR_RONDA = 10;
var ACENTOS = ['var(--morado)', 'var(--naranja)', 'var(--turquesa)', 'var(--azul)'];
var LUZ = { v: 'var(--verde)', r: 'var(--rojo)' };

/* ---------- Mazo en bucle: no se repite un caso hasta que salgan todos ---------- */
function guardar(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function leer(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }
function barajar(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
var mazo = leer('crei-mazo');
if (!mazo || !mazo.orden || mazo.orden.length !== CASOS.length) mazo = { orden: barajar(CASOS.map(function (_, i) { return i; })), pos: 0 };
var jugadores = leer('crei-jugadores') || 0;

function sacarCaso() {
  if (mazo.pos >= mazo.orden.length) {
    var ultimo = mazo.orden[mazo.orden.length - 1];
    mazo.orden = barajar(mazo.orden.slice());
    if (mazo.orden[0] === ultimo) mazo.orden.push(mazo.orden.shift());
    mazo.pos = 0;
  }
  var i = mazo.orden[mazo.pos++];
  guardar('crei-mazo', mazo);
  return CASOS[i];
}

/* ---------- Juego ---------- */
var $ = function (id) { return document.getElementById(id); };
var ronda, temporizador = null;

function ver(id) {
  document.querySelectorAll('.pantalla').forEach(function (p) { p.classList.toggle('activa', p.id === id); });
  $('b-pc').style.display = id === 'p-juego' ? 'none' : '';
}

function empezar() {
  clearTimeout(temporizador);
  ronda = { n: 0, aciertos: 0, marcas: [], caso: null, bloqueado: false };
  $('aciertos').textContent = '0';
  ver('p-juego');
  siguiente();
}

function pintarProgreso() {
  var h = '';
  for (var i = 0; i < POR_RONDA; i++) h += '<i class="' + (ronda.marcas[i] || (i === ronda.n - 1 ? 'ahora' : '')) + '"></i>';
  $('progreso').innerHTML = h;
}

function siguiente() {
  $('velo').classList.remove('ver');
  if (ronda.n >= POR_RONDA) return terminar();
  ronda.caso = sacarCaso();
  ronda.n++;
  ronda.bloqueado = false;
  $('tarjeta').style.setProperty('--acento', ACENTOS[(ronda.n - 1) % 4]);
  $('num').textContent = 'Situación ' + ronda.n + ' de ' + POR_RONDA;
  $('texto').textContent = ronda.caso[1];
  var s = $('semaforo'); s.classList.remove('respondido');
  s.querySelectorAll('.luz').forEach(function (l) { l.classList.remove('elegida', 'correcta'); });
  pintarProgreso();
}

function esc(t) { return String(t).replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }

$('semaforo').addEventListener('click', function (ev) {
  var luz = ev.target.closest('.luz');
  if (!luz || ronda.bloqueado) return;
  ronda.bloqueado = true;
  var elegido = luz.dataset.c, correcto = ronda.caso[0];
  var nose = elegido === 'n', bien = elegido === correcto;
  if (bien) ronda.aciertos++;
  ronda.marcas[ronda.n - 1] = nose ? 'nose' : (bien ? 'ok' : 'mal');
  $('aciertos').textContent = ronda.aciertos;
  pintarProgreso();

  var s = $('semaforo'); s.classList.add('respondido');
  luz.classList.add('elegida');
  s.querySelector('[data-c="' + correcto + '"]').classList.add('correcta');

  var nombre = correcto === 'v' ? 'Verde · Hay igualdad' : 'Rojo · No hay igualdad';
  if (nose) {
    $('icono').style.background = 'var(--ambar)'; $('icono').textContent = '?';
    $('r-titulo').textContent = 'Te contamos la respuesta';
    $('r-color').textContent = 'Es ' + nombre;
  } else if (bien) {
    $('icono').style.background = 'var(--verde)';
    $('icono').innerHTML = '<svg width="44" height="44" viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    $('r-titulo').textContent = '¡Correcto!';
    $('r-color').textContent = nombre;
  } else {
    $('icono').style.background = 'var(--gris)';
    $('icono').innerHTML = '<svg width="38" height="38" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round"/></svg>';
    $('r-titulo').textContent = '¡Casi!';
    $('r-color').textContent = 'La respuesta es ' + nombre;
  }
  $('r-color').style.color = LUZ[correcto];
  $('hoja').style.setProperty('--acento', LUZ[correcto]);
  $('r-resp').innerHTML = esc(ronda.caso[2]).replace(/^(No hay igualdad|Hay igualdad)/, '<b style="color:' + LUZ[correcto] + '">$1</b>');
  $('b-sig').textContent = ronda.n >= POR_RONDA ? 'Ver resultado' : 'Siguiente';
  setTimeout(function () { $('velo').classList.add('ver'); }, 450);
});

$('b-sig').addEventListener('click', siguiente);

function terminar() {
  jugadores++; guardar('crei-jugadores', jugadores);
  var a = ronda.aciertos;
  $('f-marcador').innerHTML = a + '<span> / ' + POR_RONDA + '</span>';
  var t = a >= 9 ? ['¡Excelente!', 'Reconoces muy bien cuándo hay igualdad. Gracias por ayudarnos a construir un mejor lugar para trabajar.']
    : a >= 7 ? ['¡Muy bien!', 'Tienes buen ojo para la igualdad. Sigamos practicándola en el día a día.']
    : a >= 5 ? ['¡Buen trabajo!', 'Cada situación que reconocemos nos ayuda a tratarnos mejor entre todos.']
    : ['¡Gracias por jugar!', 'La igualdad se aprende en el día a día, y hoy diste un paso más.'];
  $('f-titulo').textContent = t[0];
  $('f-texto').textContent = t[1];
  $('f-cuenta').textContent = jugadores + (jugadores === 1 ? ' persona ya jugó' : ' personas ya jugaron');
  ver('p-final');
  temporizador = setTimeout(function () { ver('p-portada'); }, 45000); // si nadie toca, vuelve a la portada
}

$('b-empezar').addEventListener('click', empezar);
$('b-otra').addEventListener('click', function () { clearTimeout(temporizador); ver('p-portada'); });
$('b-salir').addEventListener('click', function () { $('velo').classList.remove('ver'); ver('p-portada'); });

$('b-pc').addEventListener('click', function () {
  var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen;
  if (document.fullscreenElement || document.webkitFullscreenElement) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (f) { try { var p = f.call(d); if (p && p.catch) p.catch(function () {}); } catch (e) {} }
});
</script>
</body>
</html>
